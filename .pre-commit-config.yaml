# 克隆后运行 `pnpm exec pre-commit install --install-hooks` 启用
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: local
    hooks:
      - id: commitcheck
        name: '提交信息（<type>(<scope>): 描述）'
        entry: scripts/commitcheck.sh --file
        language: system
        stages: [commit-msg]
      - id: prettier
        name: prettier --check
        entry: pnpm exec prettier --check .
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: eslint
        name: eslint
        entry: pnpm exec eslint .
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: typecheck
        name: tsc --noEmit
        entry: pnpm exec tsc -p tsconfig.json --noEmit
        language: system
        pass_filenames: false
        stages: [pre-commit]
